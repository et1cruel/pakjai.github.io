<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pakjai</title>
    <link rel="stylesheet" href="/css/style.css">

</head>

<body>
    <div class="container">
        <div class="hero">
            <div class="hero-content">
                <h1>Welcome to Pakjai </h1>
                <h1> พื้นที่พักใจสำหรับคนอยากพักเรื่องวุ่นวาย</h1>
                <div class="subtitle">พักผ่อนกับธรรมชาติ สีเขียวและความสงบใจ</div>
            </div>
        </div>
    </div>
    <div class="auth-box">
        <div class="auth-tabs">
            <button class="tab-btn active" data-tab="login">เข้าสู่ระบบ</button>
            <button class="tab-btn" data-tab="signup">สมัครสมาชิก</button>
        </div>
    </div>
    <!-- Login form -->
    <form id="loginForm" class="auth-form active">
        <div class="form-group">
            <label>ชื่อผู้ใช้ / Email</label>
            <input type="text" id="loginUsername" required>
        </div>
        <div class="form-group">
            <label>รหัสผ่าน</label>
            <input type="password" id="loginPassword" required>
        </div>
        <button type="submit" class="btn-primary">เข้าสู่ระบบ</button>
    </form>

    <!-- Signup form -->
    <form id="signupForm" class="auth-form">
        <div class="form-group">
            <label>ชื่อผู้ใช้</label>
            <input type="text" id="signupUsername" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="signupEmail" required>
        </div>
        <div class="form-group">
            <label>รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label>
            <input type="password" id="signupPassword" required>
        </div>
        <div class="form-group">
            <label>ยืนยันรหัสผ่าน</label>
            <input type="password" id="signupPasswordConfirm" required>
        </div>
        <button type="submit" class="btn-primary">สมัครสมาชิก</button>
    </form>

    <div id="authMessage" class="auth-message">

    </div>

    <script src="/js/storage.js"></script>
    <script src="/js/auth.js"></script>

</body>

</html>
