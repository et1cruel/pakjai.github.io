<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ค้นหา - Pakjai พื้นที่พักใจ</title>
    <meta name="description" content="ค้นหาผู้ใช้ โพสต์ และแฮชแท็กในพื้นที่พักใจ">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/search.css">
    <link rel="stylesheet" href="/css/profile-preview.css">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar" aria-label="เมนูหลัก">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="/pakjai/dashboard.html" aria-label="กลับหน้า Feed">🌲 Pakjai</a>
            </div>
            <div class="nav-menu">
                <a href="/pakjai/dashboard.html" class="nav-link">Feed</a>
                <a href="/pakjai/search.html" class="nav-link active" aria-current="page">ค้นหา</a>
                <a href="/pakjai/messages.html" class="nav-link">ข้อความ</a>
                <a href="/pakjai/profile.html" class="nav-link">โปรไฟล์</a>
                <button type="button" id="logoutBtn" class="nav-link logout-btn">ออกจากระบบ</button>
            </div>
        </div>
    </nav>

    <main class="search-container">
        <!-- Search Box -->
        <div class="search-box-wrapper">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 ค้นหาเพื่อน ชื่อเล่น หรือ #แฮชแท็ก..." autocomplete="off">
                <button type="button" id="searchBtn" class="search-btn">ค้นหา 🍃</button>
            </div>

            <!-- Search Filters -->
            <div class="search-filters" role="tablist">
                <button type="button" class="filter-tab active" data-filter="all">ทั้งหมด</button>
                <button type="button" class="filter-tab" data-filter="users">👥 ผู้ใช้</button>
                <button type="button" class="filter-tab" data-filter="posts">📸 โพสต์</button>
                <button type="button" class="filter-tab" data-filter="tags">🏷️ แฮชแท็ก</button>
            </div>
        </div>

        <!-- Recent Searches & Trending -->
        <div id="recentSearchesContainer" class="search-section active">
            <div class="section-wrapper">
                <div class="recent-searches">
                    <h3>🔍 ค้นหาล่าสุด</h3>
                    <div id="recentSearchesList" class="searches-list"></div>
                </div>

                <div class="trending-section">
                    <h3>🔥 กำลังนิยม</h3>
                    <div id="trendingList" class="trending-list"></div>
                </div>
            </div>
        </div>

        <!-- Search Results -->
        <div id="resultsContainer" class="search-section">
            <!-- Users Results -->
            <div id="usersResults" class="results-section">
                <h3>👥 ผู้ใช้ที่พบ</h3>
                <div id="usersList" class="users-list"></div>
            </div>

            <!-- Posts Results -->
            <div id="postsResults" class="results-section">
                <h3>📸 โพสต์ที่พบ</h3>
                <div id="postsList" class="posts-results-list"></div>
            </div>

            <!-- Tags Results -->
            <div id="tagsResults" class="results-section">
                <h3>🏷️ แฮชแท็ก</h3>
                <div id="tagsList" class="tags-list"></div>
            </div>

            <!-- No Results Message -->
            <div id="noResults" class="no-results-message" style="display: none;">
                <p>ไม่พบผลลัพธ์ที่ตรงกับคำค้นหา 🍃</p>
                <p class="text-small">ลองค้นหาด้วยคำอื่น หรือกดดูแฮชแท็กที่กำลังนิยม</p>
            </div>
        </div>
    </main>

    <!-- User Preview Modal -->
    <div id="userModal" class="modal" role="dialog" aria-modal="true" aria-label="ข้อมูลผู้ใช้">
        <div class="modal-content user-modal-content">
            <button type="button" class="modal-close" aria-label="ปิดหน้าต่าง">&times;</button>
            <div id="userModalBody" class="user-modal-body"></div>
        </div>
    </div>

    <script src="/js/storage.js"></script>
    <script src="/js/search.js"></script>
    <script src="/js/profile-preview.js"></script>
</body>

</html>
